# oxido-i3-themes — Layout: Bubble (Organic Single Bar)
# Una única barra transparente que permite a las burbujas crecer nativamente.
# i3 gestiona el espacio automáticamente (override-redirect = false).

[bar/top]
width = 100%
height = 34
radius = 0
dpi = 96
background = #00000000
foreground = ${colors.foreground}
line-size = 2pt
padding-left = 1
padding-right = 1
module-margin = 0
separator = ""
font-0 = "JetBrainsMono Nerd Font Mono:size=11;3"
font-1 = "JetBrainsMono Nerd Font Mono:size=12;4"
font-2 = "JetBrainsMono Nerd Font Mono:size=22;3"
cursor-click = pointer
enable-ipc = true
wm-restack = i3
override-redirect = false
tray-background = ${colors.bubble-sys}

modules-left = ws-start xworkspaces ws-end
modules-center = center-bubble nowplaying
modules-right = sys-start dnd network-info cpu cpu-temp memory pulseaudio battery tray powermenu sys-end

# ─── Bubble Caps (Transparent BG) ───

[module/ws-start]
type = custom/text
label = ""
label-foreground = ${colors.bubble-ws}
label-background = #00000000

[module/ws-end]
type = custom/text
label = " "
label-foreground = ${colors.bubble-ws}
label-background = #00000000

[module/sys-start]
type = custom/text
label = " "
label-foreground = ${colors.bubble-sys}
label-background = #00000000

[module/sys-end]
type = custom/text
label = ""
label-foreground = ${colors.bubble-sys}
label-background = #00000000

# ─── Módulo Central: Burbuja de Fecha (Auto-caps + Auto-BG) ───

[module/center-bubble]
type = custom/script
exec = ~/.config/polybar/scripts/center-bubble.sh
interval = 1
click-left = ${HOME}/.config/polybar/scripts/date-toggle.sh
format = <label>
format-background = #00000000
label = %output%

# ─── Módulo Now Playing (Auto-caps + Auto-BG) ───

[module/nowplaying]
type = custom/script
exec = ~/.config/polybar/scripts/nowplaying.sh
tail = true
click-left = ${HOME}/.config/polybar/scripts/playerctl-wrapper.sh play-pause
click-right = ${HOME}/.config/polybar/scripts/playerctl-wrapper.sh next
format = <label>
format-background = #00000000
label = %output%

# ─── Módulos ───

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
format-background = ${colors.bubble-ws}
label-active = %name%
label-active-foreground = ${colors.primary}
label-active-underline = ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.bubble-ws}
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-background = ${colors.bubble-ws}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.empty-ws}
label-empty-background = ${colors.bubble-ws}
label-empty-padding = 1

[module/network-info]
type = internal/network
interface-type = wireless
interval = 5
format-connected-background = ${colors.bubble-sys}
format-connected-padding = 1
format-connected = <label-connected>
label-connected = " %essid%"
label-connected-foreground = ${colors.foreground}
format-disconnected-background = ${colors.bubble-sys}
format-disconnected-padding = 1
label-disconnected = "󰖪 OFF"
label-disconnected-foreground = ${colors.disabled}

[module/dnd]
type = custom/script
exec = ${HOME}/.config/themes/scripts/dnd-indicator.sh
interval = 5
format-background = ${colors.bubble-sys}
format-padding = 1
label = %output%
click-left = ${HOME}/.config/themes/scripts/toggle-dnd.sh

[module/cpu]
type = internal/cpu
interval = 3
format-background = ${colors.bubble-sys}
format-padding = 1
format-prefix = " "
format-prefix-foreground = ${colors.green}
label = "%percentage%%"

[module/cpu-temp]
type = custom/script
exec = ${HOME}/.config/themes/scripts/cputemp-widget.sh
interval = 10
signal = 15
format-background = ${colors.bubble-sys}
format-padding = 1

[module/memory]
type = internal/memory
interval = 3
format-background = ${colors.bubble-sys}
format-padding = 1
format-prefix = " "
format-prefix-foreground = ${colors.pink}
label = "%percentage_used%%"

[module/pulseaudio]
type = internal/pulseaudio
reverse-scroll = true
format-volume-background = ${colors.bubble-sys}
format-volume-padding = 1
format-volume = <label-volume>
label-volume = "%{T2}%{T-} %percentage%%"
label-volume-foreground = ${colors.foreground}
format-muted-background = ${colors.bubble-sys}
format-muted-padding = 1
label-muted = "%{T2}󰝟%{T-} MUTE"
label-muted-foreground = ${colors.alert}
click-right = pavucontrol

[module/battery]
type = custom/script
exec = ${HOME}/.config/themes/scripts/batt-widget.sh
interval = 1
signal = 10
format-background = ${colors.bubble-sys}
format-padding = 1
label = %output%
click-left = ${HOME}/.config/themes/scripts/toggle-battery-info.sh
click-right = ${HOME}/.config/themes/scripts/rofi-battery-mode.sh

[module/powermenu]
type = custom/text
format = " %{T2}%{T-}"
format-foreground = ${colors.alert}
format-background = ${colors.bubble-sys}
format-padding = 1
click-left = ${HOME}/.config/themes/scripts/rofi-powermenu.sh

[module/tray]
type = internal/tray
format-background = ${colors.bubble-sys}
tray-spacing = 8
tray-size = 65%
tray-background = ${colors.bubble-sys}
